<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenWeatherMap API Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <h1>Weather API Demo</h1>

    <p>Enter a city name below to get the current weather.</p>

    <!-- input box + button -->
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="getWeatherBtn">Get Weather</button>

    <!-- where we output weather info -->
    <div id="weatherResult"></div>

    <p>
        <strong>API documentation used:</strong>
        <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap API</a>
    </p>
</body>
</html>
